# Render Blueprint (free tier). Deploy: Render Dashboard > New > Blueprint > pick this repo.
# Secrets use `sync: false`, so Render prompts for them once and they never live in git.
# Leave any key empty to run that adapter in mock mode.
services:
  - type: web
    name: scope2cash
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # LLM: DeepSeek by default (models deepseek-flash / deepseek-v4-pro). Set LLM_PROVIDER=nvidia + NVIDIA_API_KEY for NIM.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: deepseek
      - key: TAVILY_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_BUSINESS_EMAIL
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      # Optional: public URL for PayPal checkout return/cancel URLs. Leave empty on Render: the app falls back to
      # RENDER_EXTERNAL_URL (set by Render automatically). Set it only for a custom domain.
      - key: PUBLIC_BASE_URL
        sync: false
      # Subscribe https://<service>.onrender.com/api/paypal/webhook in the PayPal Developer Dashboard, then paste its ID.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SCOPE2CASH_MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: FALLBACK_TO_MOCK
        value: "1"
      - key: FREELANCER_NAME
        value: Huilin
      # Free instances have an ephemeral filesystem: the SQLite demo store resets on redeploy/spin-down.
      - key: SCOPE2CASH_DB
        value: /tmp/scope2cash.db
      # Public-demo protection: 30 AI requests per IP per hour, a daily cap on live LLM/Tavily runs
      # (then the app falls back to the offline heuristics with a visible warning), sandbox-only invoice recipients.
      - key: SCOPE2CASH_PUBLIC_DEMO
        value: "1"
      - key: SCOPE2CASH_DAILY_LIVE_CAP  # gitleaks:allow (env var name, not a secret)
        value: "150"
      - key: SCOPE2CASH_RECIPIENT_DOMAINS
        value: example.com
      - key: SCOPE2CASH_DEMO_CLIENT_EMAIL
        sync: false
